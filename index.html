        /* Premium Packages Dark Theme */
        .premium-section {

        .premium-section .section-title {

            font-size: 2rem;
            font-weight: 700;

        .premium-section .section-title span {

        }

        .premium-section .section-subtitle {

        .premium-grid {

            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

        .premium-card {

            display: flex;

        }

        .premium-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .premium-badge-wrapper {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;

            font-size: 0.85rem;

        .premium-card-title {

        .premium-card-desc {

        .premium-card-price {

        }

        /* Live Score Section */
        .livescore-section {
            background-color: #0b122b;
            padding: 4rem 0;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .livescore-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .livescore-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .livescore-title {
            font-size: 2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .livescore-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .match-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .match-league {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .match-time {
            color: #ef4444;
            font-weight: 700;
        }

        .match-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2.2rem;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            min-width: 100px;
            justify-content: center;
        }

        .score-separator {
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.5rem;
        }

        .match-footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
        }

        .odds-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .score-box {
                font-size: 1.8rem;
                min-width: 80px;
                padding: 0.4rem 0.6rem;
            }

            .team-name {
                font-size: 0.95rem;
            }

            .livescore-title {
                font-size: 1.5rem;
            }
        }


        .premium-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #fbb429;
            color: #121420;
            font-weight: 700;
            border-radius: 30px;
            text-decoration: none;
            transition: background 0.2s;
            text-transform: uppercase;
        }

        .premium-card:hover .premium-btn {
            background: #ffd05b;
        }

        .buy-trigger {
            cursor: pointer;
        }


        /* Payment Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
